       pie:"DESLIZA PARA VER MÁS",

       pie:"DESLIZA PARA VER MÁS",

  8: { modo:"post", imagen:"TANE 9.JPEG",

       linea1:"LOS MISMOS", linea2:"DE SIEMPRE",
       bajada:"Baby Jey, Jamez Manuel, Kuroh, ALBLACK, Poison Kid, Pablo Diablo y el mexicano Sleezy O. Cinco de ellos ya habían estado en CARO VOL. 1, y buena parte del disco se grabó en La Sede, la casa-estudio donde vivió con varios. En la producción está él mismo junto a Loose, Killua97 y Discan.",

       brillo:0.82, pos:0.24, posx:0.5, zoom:1, clara:false },

  9: { modo:"collage", collage:"radar" }

const N = parseInt(new URLSearchParams(location.search).get("n") || "1", 10);
const L = LAMINAS[N];

// El generador lee sus campos del formulario. Acá se los damos desde la lámina,
// con los mismos nombres, para no tocar su código.
const VALORES = {
  categoria: L.categoria || "", fecha: L.fecha || "",
  pildora: L.pildora || "", linea1: L.linea1 || "", linea2: L.linea2 || "",
  bajada: L.bajada || "", pie: L.pie || "",
  zoom: L.zoom || 1, pos: (L.pos !== undefined ? L.pos : 0.22) * 100,
  posx: (L.posx !== undefined ? L.posx : 0.5) * 100,
  brillo: L.brillo !== undefined ? L.brillo : 0.88,
  clara: !!L.clara,
  "l-texto": L.texto || "", "l-tam": L.tam || 88,
  "l-fondotipo": "misma", "l-desenfoque": L.desenfoque || 14,
  "l-brillo": L.brilloFondo || 1.05
};
const $ = id => ({ value: String(VALORES[id] ?? ""), checked: !!VALORES[id] });

let modo = L.modo === "lamina" ? "lamina" : "post";
let foto = null, imgLamina = null, fondoLamina = null;
let videoPortada = null, videoLamina = null;

// Lo que el generador declara fuera de los tramos que copié.
const cv = document.getElementById("vista");
const cx = cv.getContext("2d");
const logo = new Image();

window.onerror = (m, f, l) => { document.title = "ERROR " + m + " @" + l; };
</script>

<script src="plantilla-generador.js"></script>

<script>
function cargar(src){
  return new Promise((ok, mal) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = mal;
    i.src = src;
  });
}

(async function(){
  await document.fonts.load("132px Anton");
  await document.fonts.load("700 30px Montserrat");
  await document.fonts.ready;

  // La lámina 9 es solo el fondo: va el collage tal cual, sin plantilla encima.
  if (L.modo === "collage"){
    const c = await cargar("collage-radar.png");
    cx.drawImage(c, 0, 0, W, H);
    document.title = "listo";
    return;
  }

  await new Promise(r => { logo.onload = r; logo.src = "data:image/png;base64," + LOGO_B64; });

  if (L.modo === "lamina"){
    imgLamina = await cargar(L.imagen);
    dibujarLamina();
  } else {
    foto = await cargar(L.collage ? "collage.png" : L.imagen);
    dibujar();
  }
  document.title = "listo";
})();
</script>
</body>
