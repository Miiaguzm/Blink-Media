<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Blink Radar VLNTNA B</title>
<style>
  :root{
    --negro:  #0A0A0A;
    --morado: #7B2CFF;
    --blanco: #FFFFFF;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--negro); }

  .lamina{
    position:relative;
    width:1080px; height:1350px;
    background:var(--negro);
    overflow:hidden;
    font-family:"Montserrat", sans-serif;
  }

  /* ---------------------------------------------------------------- FONDO */
  .fondo{ position:absolute; inset:0; z-index:0; }
  .fondo img{
    position:absolute; inset:0; width:1080px; height:1350px;
    filter:grayscale(1) contrast(1.24) brightness(.66);
  }
  .fondo .tinte{
    position:absolute; inset:0; background:var(--morado);
    mix-blend-mode:color; opacity:.68;
  }
  .fondo .velo{
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(10,10,10,.90) 0%,  rgba(10,10,10,.46) 14%,
      rgba(10,10,10,.34) 28%, rgba(10,10,10,.62) 44%,
      rgba(10,10,10,.74) 62%, rgba(10,10,10,.80) 100%);
  }
  /* Las fotos de ella son claras y apagaban el rótulo morado de la portada.
     Se oscurece el fondo detrás del bloque, nunca la letra. */
  .halo{
    position:absolute; z-index:2; left:0; right:0; top:360px; height:660px;
    background:linear-gradient(180deg,
      rgba(10,10,10,0) 0%, rgba(10,10,10,.60) 22%,
      rgba(10,10,10,.60) 78%, rgba(10,10,10,0) 100%);
  }
  .lamina.interior .fondo img{ filter:grayscale(1) contrast(1.18) brightness(.50); }
  .lamina.interior .fondo .velo{ background:rgba(10,10,10,.62); }

  .radar{ position:absolute; inset:0; z-index:1; }
  .logo{ position:absolute; top:40px; right:64px; width:208px; z-index:5; }

  /* --------------------------------------- la cabecera de la portada */
  .cabecera{ position:absolute; top:92px; left:72px; z-index:6; }
  .cabecera .fila{ display:flex; align-items:center; gap:22px; }
  .cabecera .destello{ width:38px; height:38px; }
  .cabecera .rotulo{
    font-weight:800; font-size:31px; letter-spacing:5px;
    color:var(--morado); text-transform:uppercase;
  }
  .cabecera .edicion{
    margin-top:14px; margin-left:60px;
    font-weight:600; font-size:27px; letter-spacing:3.4px;
    color:rgba(255,255,255,.88); text-transform:uppercase;
  }

  /* ------------------------------------------- el centro de la portada */
  .centro{
    position:absolute; z-index:6; left:62px; right:62px; top:0; bottom:0;
    padding:230px 0 220px;
    display:flex; flex-direction:column; justify-content:center;
    text-align:center;
  }
  .centro .genero{
    font-weight:800; font-size:27px; letter-spacing:8px;
    color:var(--morado); text-transform:uppercase; margin-bottom:22px;
  }
  .centro .nombre{
    font-family:"Anton", sans-serif;
    font-size:176px; line-height:.94; color:var(--blanco);
    letter-spacing:1px; text-transform:uppercase;
  }
  .centro .nombre em{
    font-style:normal; display:block; margin-top:10px;
    font-size:112px; color:var(--morado);
  }
  .centro .bajada{
    margin:32px auto 0; max-width:860px;
    font-weight:600; font-size:31px; line-height:1.4;
    color:rgba(255,255,255,.95); text-wrap:balance;
  }

  .pie{
    position:absolute; z-index:6; left:0; right:0; bottom:84px;
    border-top:1.5px solid rgba(255,255,255,.20); padding-top:46px;
    display:flex; align-items:center; justify-content:center; gap:20px;
  }
  .pie span{
    font-weight:800; font-size:26px; letter-spacing:3.4px;
    color:var(--blanco); text-transform:uppercase;
  }
  .pie svg{ width:42px; height:26px; }

  /* ------------------------------------- el cuerpo de las interiores */
  .cuerpo{
    position:absolute; z-index:5; left:72px; right:72px; top:0; bottom:0;
    padding:206px 0 104px;
    display:flex; flex-direction:column; justify-content:center; gap:34px;
  }
  .titular{
    font-family:"Anton", sans-serif; font-size:100px; line-height:1.0;
    letter-spacing:.5px; text-transform:uppercase;
  }
  .titular .uno{ color:var(--blanco); display:block; }
  .titular .dos{ color:var(--morado); display:block; margin-top:12px; }

  .texto{ font-weight:600; font-size:34px; line-height:1.4; color:rgba(255,255,255,.96); }

  .destacado{
    display:flex; align-items:flex-start; gap:22px;
    border-left:4px solid var(--morado); padding-left:26px;
  }
  .destacado .destello{ width:30px; height:30px; flex:none; margin-top:6px; }
  .destacado p{ font-weight:700; font-size:32px; line-height:1.36; color:rgba(255,255,255,.96); }

  /* --------------------------------------------------------- recortes */
  /* Fotos pegadas encima, ladeadas y con borde blanco, como copias en papel.
     Algunas se salen del lienzo a propósito: es lo que saca a la lámina de
     parecer una página y la deja con movimiento. */
  .recorte{
    overflow:hidden; border:6px solid rgba(255,255,255,.95); border-radius:3px;
    box-shadow:0 20px 44px rgba(0,0,0,.50);
  }
  .recorte img{ width:100%; height:100%; object-fit:cover; display:block; }

  .conFoto{ display:flex; align-items:center; gap:30px; }
  .conFoto .columna{ flex:1; display:flex; flex-direction:column; gap:28px; }
  .conFoto .recorte{ flex:none; width:312px; height:404px; transform:rotate(3.4deg); }
  /* La captura trae el botón "Repostear" arriba a la derecha y las flechas
     del carrusel a media altura: acercando la foto se van fuera del marco. */
  .conFoto .recorte img{ transform:scale(1.34); transform-origin:10% 58%; }

  .parDeFotos{ display:flex; gap:26px; }
  .parDeFotos .recorte{ flex:1; height:300px; }
  .parDeFotos.corta .recorte{ height:240px; }
  .parDeFotos .recorte:first-child{ transform:rotate(-2.2deg); }
  .parDeFotos .recorte:last-child{ transform:rotate(2deg); }
  .parDeFotos .recorte:first-child img{ object-position:50% 6%; }
  .parDeFotos .recorte:last-child img{ object-position:42% 4%; }

  /* un recorte que se sale por el borde derecho */
  .sangra{
    position:absolute; z-index:6; right:-78px; bottom:96px;
    width:330px; height:420px; transform:rotate(-4.2deg);
  }
  .sangra img{ transform:scale(1.18); object-position:50% 8%; }

  /* En las láminas con foto sangrada, el texto se queda en su mitad. */
  .cuerpo.apretado{ gap:26px; }
  .cuerpo.arriba{ justify-content:flex-start; }
  .cuerpo.angosto .texto, .cuerpo.angosto .destacado{ max-width:636px; }
  .cuerpo.angosto .ticket{ max-width:752px; }
  .cuerpo.angosto .filas, .cuerpo.angosto .filasDesc{ max-width:636px; }

  /* una foto ancha, de borde a borde de la caja */
  .fotoAncha{ height:306px; transform:rotate(-1.4deg); }
  .fotoAncha img{ object-position:50% 16%; }

  .dijo{ font-style:italic; }

  /* las cifras, en cajas */
  .cifras{ display:flex; gap:24px; }
  .cifras .caja{
    flex:1; text-align:center;
    border:1.5px solid rgba(255,255,255,.24); border-radius:20px;
    background:rgba(10,10,10,.46); padding:24px 14px 20px;
  }
  .cifras .numero{ font-family:"Anton", sans-serif; font-size:88px; line-height:.94; color:var(--blanco); }
  .cifras .caja.morada .numero{ color:var(--morado); }
  .cifras .que{
    margin-top:10px; font-weight:800; font-size:19px; letter-spacing:2px;
    color:rgba(255,255,255,.82); text-transform:uppercase;
  }

  /* filas con separadores */
  .filas{ display:flex; flex-direction:column; }
  .filas .fila{
    display:flex; align-items:center; justify-content:space-between; gap:22px;
    border-top:1.5px solid rgba(255,255,255,.26);
    padding:18px 2px 16px;
  }
  .filas .fila b{
    font-family:"Anton", sans-serif; font-weight:400; font-size:62px;
    line-height:1; letter-spacing:.5px; color:var(--blanco);
  }
  .filas .fila i{
    flex:none; font-style:normal;
    border:1.5px solid rgba(255,255,255,.34); border-radius:999px;
    padding:9px 22px;
    font-weight:800; font-size:20px; letter-spacing:2.2px;
    color:rgba(255,255,255,.88); text-transform:uppercase;
  }

  /* pastillas con nombres, ladeadas: una nube en vez de una enumeración.
     Cada una lleva además la canción que hicieron juntos, que es el dato que
     convierte la lista de nombres en información. */
  .chips{ display:flex; flex-wrap:wrap; gap:18px 16px; }
  .chips span{
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    border:2px solid rgba(255,255,255,.40); border-radius:30px;
    background:rgba(10,10,10,.54); padding:14px 27px 13px;
  }
  .chips span b{
    font-family:"Anton", sans-serif; font-weight:400; font-size:42px;
    line-height:1; letter-spacing:.5px; color:var(--blanco); text-transform:uppercase;
  }
  .chips span u{
    text-decoration:none; font-weight:700; font-size:21px;
    color:rgba(255,255,255,.80);
  }
  .chips span:nth-child(odd){ transform:rotate(-1.6deg); }
  .chips span:nth-child(even){ transform:rotate(1.4deg); }
  .chips span.morada{ border-color:var(--morado); }
  .chips span.morada b{ color:var(--morado); }

  /* filas con descripción: para cuando cada nombre necesita una línea que
     explique qué es, y no solo una etiqueta */
  .filasDesc{ display:flex; flex-direction:column; }
  .filasDesc .fila{
    border-top:1.5px solid rgba(255,255,255,.26);
    padding:20px 2px 18px;
  }
  .filasDesc .cab{ display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .filasDesc .cab b{
    font-family:"Anton", sans-serif; font-weight:400; font-size:58px;
    line-height:1; letter-spacing:.5px; color:var(--blanco);
  }
  .filasDesc .cab i{
    flex:none; font-style:normal;
    border:1.5px solid rgba(255,255,255,.34); border-radius:999px;
    padding:8px 20px;
    font-weight:800; font-size:19px; letter-spacing:2.2px;
    color:rgba(255,255,255,.88); text-transform:uppercase;
  }
  .filasDesc p{
    margin-top:10px; max-width:600px;
    font-weight:600; font-size:27px; line-height:1.34; color:rgba(255,255,255,.90);
  }

  /* la entrada del show, dibujada como lo que es: un talón */
  .ticket{
    display:flex; align-items:stretch; transform:rotate(-1.1deg);
    background:linear-gradient(180deg,#1C1726 0%,#0C0A12 100%);
    border:2px solid rgba(255,255,255,.24); border-radius:18px;
    box-shadow:0 22px 48px rgba(0,0,0,.52);
    overflow:hidden;
  }
  .ticket .lado{ flex:1; padding:44px 40px 42px; }
  .ticket .lado b{
    display:block; font-family:"Anton", sans-serif; font-weight:400;
    font-size:86px; line-height:.98; color:var(--blanco); text-transform:uppercase;
  }
  .ticket .lado b em{ font-style:normal; color:var(--morado); }
  .ticket .lado span{
    display:block; margin-top:16px;
    font-weight:700; font-size:27px; color:rgba(255,255,255,.88);
  }
  .ticket .corte{ flex:none; width:2px; border-left:3px dashed rgba(255,255,255,.34); }
  .ticket .talon{
    flex:none; width:276px; padding:44px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    text-align:center;
  }
  .ticket .talon i{
    font-style:normal; font-weight:800; font-size:17px; letter-spacing:3px;
    color:var(--morado); text-transform:uppercase;
  }
  .ticket .talon b{
    font-family:"Anton", sans-serif; font-weight:400; font-size:64px; line-height:1;
    color:var(--blanco); text-transform:uppercase;
  }
  .ticket .talon u{
    text-decoration:none; font-weight:800; font-size:30px;
    color:rgba(255,255,255,.90);
  }

  /* el recuadro donde Mia monta el video, en 16:9 */
  .video{ display:flex; flex-direction:column; align-items:center; gap:26px; }
  .video .marco{
    position:relative; width:936px; height:527px;
    background:#000; border:2.5px solid var(--morado); border-radius:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .video .marco svg{ width:96px; height:96px; opacity:.5; }
  .video .texto-video{ text-align:center; }
  .video .texto-video b{
    display:block; font-weight:800; font-size:31px; line-height:1.3; color:#FFFFFF;
  }
  .video .texto-video span{
    display:block; margin-top:8px;
    font-weight:600; font-size:28px; line-height:1.3; color:rgba(255,255,255,.82);
  }

  /* el cierre de Blink, su propia lámina */
  .cierre{
    position:absolute; z-index:5; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px;
  }
  .cierre .remate{
    font-family:"Anton", sans-serif; font-size:132px; line-height:1.02;
    color:var(--blanco); text-align:center; text-transform:uppercase;
  }
  .cierre .remate em{ color:var(--morado); font-style:normal; display:block; margin-top:34px; }
  .cierre .cuenta{
    border:1.5px solid rgba(255,255,255,.34); border-radius:999px; padding:16px 38px;
    font-weight:800; font-size:30px; letter-spacing:2.6px; color:var(--blanco);
  }
  .cierre .lema{
    font-weight:600; font-size:27px; letter-spacing:3px;
    color:rgba(255,255,255,.70); text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="lamina" id="lamina"></div>

<script>
const DESTELLO =
  '<svg class="destello" viewBox="0 0 24 24" fill="#7B2CFF">' +
  '<path d="M 12 0.94 L 12.57 10.61 L 13.99 10.01 L 13.39 11.43 L 23.06 12 ' +
  'L 13.39 12.57 L 13.99 13.99 L 12.57 13.39 L 12 23.06 L 11.43 13.39 ' +
  'L 10.01 13.99 L 10.61 12.57 L 0.94 12 L 10.61 11.43 L 10.01 10.01 ' +
  'L 11.43 10.61 Z"/></svg>';

const FLECHA =
  '<svg viewBox="0 0 42 26" fill="none" stroke="#7B2CFF" stroke-width="3.4" ' +
  'stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M2 13 H38 M28 4 L38 13 L28 22"/></svg>';

const PLAY =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#7B2CFF" stroke-width="1.6" ' +
  'stroke-linejoin="round"><path d="M9 7.5 L17.5 12 L9 16.5 Z"/></svg>';

function radar(){
  const radios = [152, 298, 452, 612, 782, 962, 1150];
  const anillos = radios.map((r, i) =>
    '<circle cx="540" cy="700" r="' + r + '" stroke="#7B2CFF" stroke-width="2.6" ' +
    'opacity="' + (0.72 - i * 0.065).toFixed(3) + '" fill="none"/>').join("");
  return '<svg class="radar" viewBox="0 0 1080 1350">' + anillos + '</svg>';
}

function fondo(){
  return '<div class="fondo"><img src="collage-vlntnab.png" alt="">' +
    '<div class="tinte"></div><div class="velo"></div></div>';
}

function titular(a, b){
  return '<div class="titular"><span class="uno">' + a + '</span>' +
         '<span class="dos">' + b + '</span></div>';
}

function filas(items){
  return '<div class="filas">' + items.map(f =>
    '<div class="fila"><b>' + f[0] + '</b><i>' + f[1] + '</i></div>').join("") + '</div>';
}

function chips(pares){
  return '<div class="chips">' + pares.map((n, i) =>
    '<span' + (i % 3 === 1 ? ' class="morada"' : '') + '>' +
    '<b>' + n[0] + '</b><u>' + n[1] + '</u></span>').join("") + '</div>';
}

function filasDesc(items){
  return '<div class="filasDesc">' + items.map(f =>
    '<div class="fila"><div class="cab"><b>' + f[0] + '</b><i>' + f[1] + '</i></div>' +
    '<p>' + f[2] + '</p></div>').join("") + '</div>';
}

function recorte(src, clase, pos){
  return '<div class="recorte ' + (clase || '') + '"><img src="' + src + '" alt=""' +
    (pos ? ' style="object-position:' + pos + '"' : '') + '></div>';
}

const LAMINAS = {

  1: { portada:true, html:
    '<div class="cabecera">' +
      '<div class="fila">' + DESTELLO + '<div class="rotulo">Blink Radar</div></div>' +
      '<div class="edicion">Edición noviembre 2026</div>' +
    '</div>' +
    '<div class="centro">' +
      '<div class="genero">Urbano · R&amp;B · Pop</div>' +
      '<div class="nombre">VLNTNA B<em>abrió otra era</em></div>' +
      '<div class="bajada">La artista de Antofagasta que este año se cambió ' +
        'al pop electrónico</div>' +
    '</div>' +
    '<div class="pie"><span>Desliza para conocerla</span>' + FLECHA + '</div>' },

  2: { html:
    '<div class="cuerpo">' +
      titular("¿Quién es", "VLNTNA B?") +
      '<div class="conFoto">' +
        '<div class="columna">' +
          '<p class="texto">Valentina Belén León es de Antofagasta, y su nombre ' +
          'artístico sale de las consonantes del suyo. Subió su primera canción, ' +
          '“Cicatrices”, en 2019, y desde 2022 viene publicando un proyecto por año.</p>' +
        '</div>' +
        recorte("vlntnb4.png") +
      '</div>' +
      '<p class="texto">Su música se mueve entre el R&amp;B, el trap, el reguetón y ' +
      'el pop sin quedarse en ninguno: lo que la ordena son las letras, que hablan ' +
      'de nostalgia, de deseo y de relaciones.</p>' +
      '<div class="cifras">' +
        '<div class="caja"><div class="numero">4</div>' +
          '<div class="que">Proyectos publicados</div></div>' +
        '<div class="caja morada"><div class="numero">2019</div>' +
          '<div class="que">Su primera canción</div></div>' +
      '</div>' +
    '</div>' },

  3: { html:
    '<div class="cuerpo angosto">' +
      titular("Del corno francés", "a Primavera Sound") +
      '<p class="texto">Antes de la música urbana estuvo tres años tocando corno ' +
      'francés en la orquesta de su colegio, que es donde aprendió a leer partituras. ' +
      'Seguía estudiando Administración Pública en Antofagasta cuando la anunciaron ' +
      'en el cartel de Primavera Sound Chile 2022: congeló quinto año y se fue a ' +
      'vivir a Santiago para dedicarse a esto.</p>' +
      '<div class="destacado">' + DESTELLO +
        '<p><span class="dijo">“Una de las grandes brechas que existe es la súper ' +
        'poca descentralización en las artes”</span></p>' +
      '</div>' +
    '</div>' +
    recorte("vlntnb2.png", "sangra") },

  4: { html:
    '<div class="cuerpo apretado arriba">' +
      titular("Cuatro proyectos", "en cuatro años") +
      filas([
        ["FEELS",       "EP · 2022"],
        ["AQUA",        "Álbum · 2023"],
        ["MAL AUGURIO", "Mixtape · 2024"],
        ["LOTO",        "EP · 2025"]
      ]) +
      '<p class="texto">AQUA son trece canciones sobre sus años entre dos ciudades. ' +
      'Y de LOTO, el más nuevo, la canción elegida para presentarlo fue “Rodeada de ' +
      'flores”, que grabó con Face.</p>' +
      '<div class="parDeFotos corta">' +
        recorte("vlntnb5.png", "", "50% 31%") +
        recorte("vlntnb7.png", "", "42% 5%") +
      '</div>' +
    '</div>' },

  5: { html:
    '<div class="cuerpo angosto">' +
      titular("Con quiénes", "ha grabado") +
      chips([
        ["Kidd Voodoo", "“Dime”"],
        ["Easykid",     "“Zúmbate”"],
        ["Ceaese",      "“Dancin’”"],
        ["DURAN",       "“Pensando en mí”"],
        ["Akatumamy",   "“de to’”"],
        ["Shirel",      "“Otra nota”"]
      ]) +
      '<p class="texto">Su primer EP, FEELS, lo hizo completo junto a KYA, y de ahí ' +
      'salió “Jui$y”.</p>' +
    '</div>' +
    recorte("vlntnb.png", "sangra") },

  6: { html:
    '<div class="cuerpo angosto">' +
      titular("2026: del R&amp;B", "al pop electrónico") +
      filasDesc([
        ["A MI MANERA", "Mayo",
         "Abrió la etapa con un sonido más oscuro y sensual que todo lo anterior."],
        ["PACTO", "Junio",
         "Mezcló pop, reguetón y electrónica, y metió dos ambientes distintos dentro de una misma canción."],
        ["TENSiON", "Agosto",
         "Se fue derecho al hyperpop, con la estética del pop de los 2000: la de MTV y VH1."]
      ]) +
    '</div>' +
    recorte("vlntnb6.png", "sangra") },

  7: { html:
    '<div class="cuerpo angosto">' +
      titular("Toda esta era,", "en una noche") +
      '<p class="texto">El 27 de noviembre hace IT GIRL: The Show en la Sala SCD ' +
      'Bellavista, donde las canciones de esta etapa se van a escuchar al lado de ' +
      'las de AQUA, MAL AUGURIO y LOTO.</p>' +
      '<div class="ticket">' +
        '<div class="lado"><b>It Girl:<em> The Show</em></b>' +
          '<span>Sala SCD Bellavista, Santiago</span></div>' +
        '<div class="corte"></div>' +
        '<div class="talon"><i>Viernes</i><b>27 Nov</b><u>20:00</u></div>' +
      '</div>' +
    '</div>' +
    recorte("vlntnb8.png", "sangra") },

  8: { html:

const N = parseInt(new URLSearchParams(location.search).get("n") || "1", 10);
const L = LAMINAS[N];
const caja = document.getElementById("lamina");
if (!L.portada) caja.classList.add("interior");
caja.innerHTML = fondo() + (L.portada ? '<div class="halo"></div>' : '') + radar() +
  '<img class="logo" src="logo-blink.png" alt="Blink">' + L.html;

(async function(){
  await document.fonts.load("176px Anton");
  await document.fonts.load("600 34px Montserrat");
  await document.fonts.ready;

  // document.fonts.check() miente, así que se comprueba midiendo: Anton es
  // condensada y tiene que medir bastante menos que Montserrat al mismo cuerpo.
  const m = document.createElement("canvas").getContext("2d");
  m.font = "100px Anton";       const anchoAnton = m.measureText("HAMBURGUESA ABCDEFG").width;
  m.font = "100px Montserrat";  const anchoMont  = m.measureText("HAMBURGUESA ABCDEFG").width;
  const fuentesOk = anchoAnton < anchoMont * 0.85;

  const achicar = (el, base, minimo, ancho) => {
    let t = base;
    while (t > minimo && el.scrollWidth > ancho){ t -= 1; el.style.fontSize = t + "px"; }
  };
  const n = caja.querySelector(".centro .nombre");
  if (n){
    achicar(n, 176, 96, 956);
    const e = n.querySelector("em");
    if (e) achicar(e, 112, 62, 956);
  }
  caja.querySelectorAll(".titular span").forEach(s => achicar(s, 100, 54, 936));
  const r = caja.querySelector(".cierre .remate");
  if (r) achicar(r, 132, 70, 936);
  caja.querySelectorAll(".filas .fila b").forEach(s => achicar(s, 62, 34, 600));
  caja.querySelectorAll(".filasDesc .cab b").forEach(s => achicar(s, 58, 32, 460));
  const t = caja.querySelector(".ticket .lado b");
  if (t) achicar(t, 86, 42, 382);

  document.title = fuentesOk ? "listo" : "FALTAN LAS FUENTES";
})();
</script>
