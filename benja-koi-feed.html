<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>KOI · Benja Valencia · Blink</title>
<style>
  :root{ --negro:#0A0A0A; --morado:#7B2CFF; --blanco:#FFFFFF; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--negro); }

  .lamina{
    position:relative; width:1080px; height:1350px;
    background:var(--negro); overflow:hidden;
    font-family:"Montserrat", sans-serif;
  }

  /* La portada es casi cuadrada y la cara ocupa el centro, así que a sangre el
     titular se la come. Va enmarcada arriba y el texto abajo, igual que en una
     lámina, y el fondo es la misma foto ampliada y desenfocada para que la
     gráfica se lea como una pieza y no como una foto pegada sobre negro. */
  .fondo{ position:absolute; inset:0; overflow:hidden; }
  .fondo img{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1.35);
    width:1080px; height:1350px; object-fit:cover;
    filter:blur(26px) brightness(.62) saturate(1.1);
  }
  .velo{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(123,44,255,.20) 0%, rgba(10,10,10,0) 60%),
      linear-gradient(180deg,
        rgba(10,10,10,.72) 0%, rgba(10,10,10,.46) 14%,
        rgba(10,10,10,.46) 62%, rgba(10,10,10,.88) 78%, var(--negro) 96%);
  }

  /* ------------------------------------------------------- encabezado */
  .cabecera{ position:absolute; z-index:3; top:62px; left:72px; right:72px;
             display:flex; align-items:flex-start; justify-content:space-between; }
  .categoria{ display:flex; align-items:center; gap:12px;
              font-weight:800; font-size:25px; letter-spacing:3.6px;
              color:var(--morado); text-transform:uppercase; }
  .fecha{ margin-top:12px; font-weight:600; font-size:24px; letter-spacing:2.4px;
          color:rgba(255,255,255,.72); }
  .cabecera img{ width:132px; display:block; }

  /* ------------------------------------------------------------ foto */
  .marco{
    position:absolute; z-index:3; left:200px; top:176px;
    width:680px; height:680px; border-radius:26px; overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.55);
  }
  .marco img{ width:100%; height:100%; object-fit:cover; object-position:50% 46%; }

  /* ---------------------------------------------------------- bloque */
  .bloque{ position:absolute; z-index:3; left:72px; right:72px; bottom:150px; }
  .pildora{
    display:inline-block; background:var(--morado); border-radius:999px;
    padding:14px 30px 12px;
    font-weight:800; font-size:24px; letter-spacing:3.4px;
    color:var(--blanco); text-transform:uppercase;
  }
  .titular{
    margin-top:24px;
    font-family:"Anton", sans-serif; font-size:96px; line-height:.95;
    letter-spacing:1px; color:var(--blanco); text-transform:uppercase;
  }
  .titular span{ display:block; }
  .titular .morado{ color:var(--morado); }
  .dato{
    margin-top:26px; font-weight:700; font-size:28px; letter-spacing:1.4px;
    color:rgba(255,255,255,.90);
  }

  /* ------------------------------------------------------------- pie */
  .pie{
    position:absolute; z-index:3; left:72px; right:72px; bottom:66px;
    padding-top:30px; border-top:1.5px solid rgba(255,255,255,.20);
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .pie span{ font-weight:800; font-size:22px; letter-spacing:3.4px;
             color:var(--morado); text-transform:uppercase; }
  .pie svg{ width:22px; height:22px; flex:none; }
</style>
</head>
<body>
<div class="lamina">

  <div class="fondo"><img src="benja-koi-portada.jpg" alt=""></div>
  <div class="velo"></div>

  <div class="cabecera">
    <div>
      <div class="categoria">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#7B2CFF">
          <path d="M12 0 L13.8 10.2 L24 12 L13.8 13.8 L12 24 L10.2 13.8 L0 12 L10.2 10.2 Z"/>
        </svg>
        Lanzamiento
      </div>
      <div class="fecha">18.NOV.2026</div>
    </div>
    <img src="logo-blink.png" alt="Blink">
  </div>

  <div class="marco"><img src="benja-koi-portada.jpg" alt=""></div>

  <div class="bloque">
    <div class="pildora">Nuevo álbum</div>
    <div class="titular"><span>KOI abre una</span><span class="morado">nueva etapa</span></div>
    <div class="dato">Jueves 26 de noviembre · 21:00</div>
  </div>

  <div class="pie">
    <svg viewBox="0 0 24 24" fill="none" stroke="#7B2CFF" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 V19 M5 12 L12 19 L19 12"/>
    </svg>
    <span>Abajo te contamos los detalles</span>
  </div>

</div>

<script>
(async function(){
  await document.fonts.load("96px Anton");
  await document.fonts.load("800 24px Montserrat");
  await document.fonts.load("700 28px Montserrat");
  await document.fonts.ready;

  // Las dos líneas del titular comparten cuerpo: ajustadas por separado, la
  // corta queda grande y la larga achicada, y se nota el escalón.
  const lineas = [...document.querySelectorAll(".titular span")];
  let t = 96;
  while (t > 72 && lineas.some(l => l.scrollWidth > 936)){
    t -= 2;
    lineas.forEach(l => { l.style.fontSize = t + "px"; });
  }

  // document.fonts.check() miente: se comprueba midiendo, porque Anton es
  // condensada y tiene que medir bastante menos que Montserrat al mismo cuerpo.
  const m = document.createElement("canvas").getContext("2d");
  m.font = "100px Anton";       const a = m.measureText("HAMBURGUESA ABCDEFG").width;
  m.font = "100px Montserrat";  const b = m.measureText("HAMBURGUESA ABCDEFG").width;
  document.title = a < b * 0.85 ? "listo" : "FALTAN LAS FUENTES";
})();
</script>
</body>
</html>
