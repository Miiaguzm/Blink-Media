<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Collage TANE</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#0A0A0A; }

  .lamina{ position:relative; width:1080px; height:1350px; background:#0A0A0A; overflow:hidden; }

  .lamina img{
    position:absolute;
    object-fit:cover;
    border:3px solid rgba(255,255,255,.92);
  }

  /* arriba, tres */
  .p1{ left:-46px; top:-56px; width:452px; height:632px; object-position:50% 0%;  transform:rotate(-2.4deg); z-index:3; }
  .p2{ left:344px; top:-88px; width:432px; height:618px; object-position:50% 30%; transform:rotate(2.2deg);  z-index:2; }
  .p3{ left:718px; top:-46px; width:424px; height:600px; object-position:50% 22%; transform:rotate(-2.8deg); z-index:4; }
  /* al medio, dos más anchas */
  .p4{ left:-52px; top:436px; width:612px; height:586px; object-position:50% 16%; transform:rotate(2.6deg);  z-index:6; }
  .p5{ left:506px; top:404px; width:638px; height:622px; object-position:50% 62%; transform:rotate(-2.2deg); z-index:5; }
  /* abajo, dos que cierran el alto completo */
  .p6{ left:-40px; top:910px; width:560px; height:500px; object-position:50% 78%; transform:rotate(-2.2deg); z-index:7; }
  .p7{ left:470px; top:938px; width:650px; height:472px; object-position:50% 74%; transform:rotate(2.4deg);  z-index:8; }

  /* el círculo de radar, solo en la versión con radar */
  .radar{
    position:absolute; z-index:20;
    left:50%; top:675px; transform:translate(-50%,-50%);
    width:720px; height:720px;
    pointer-events:none;
    display:none;
  }
  body.con-radar .radar{ display:block; }
  .radar .halo{
    position:absolute; inset:-16%;
    background:radial-gradient(circle,
      rgba(123,44,255,.30) 0%, rgba(123,44,255,.10) 48%, rgba(123,44,255,0) 70%);
  }
  .radar .barrido{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 208deg,
      rgba(123,44,255,.60) 0deg, rgba(123,44,255,.20) 30deg,
      rgba(123,44,255,0) 78deg, rgba(123,44,255,0) 360deg);
    mask-image:radial-gradient(circle, #000 0 99%, transparent 100%);
  }
  .radar svg{ position:absolute; inset:0; }
</style>
</head>
<body>
<div class="lamina">
  <img class="p1" src="TANE 8.JPEG" alt="">
  <img class="p2" src="TANE 1.png"  alt="">
  <img class="p3" src="TANE 7.JPEG" alt="">
  <img class="p4" src="TANE 2.png"  alt="">
  <img class="p5" src="TANE 9.JPEG" alt="">
  <img class="p6" src="TANE 8.JPEG" alt="">
  <img class="p7" src="TANE 7.JPEG" alt="">

  <div class="radar">
    <div class="halo"></div>
    <div class="barrido"></div>
    <svg viewBox="0 0 720 720" fill="none">
      <circle cx="360" cy="360" r="358" stroke="#7B2CFF" stroke-width="2.5" opacity=".85"/>
      <circle cx="360" cy="360" r="270" stroke="#7B2CFF" stroke-width="2"   opacity=".62"/>
      <circle cx="360" cy="360" r="182" stroke="#7B2CFF" stroke-width="2"   opacity=".48"/>
      <circle cx="360" cy="360" r="94"  stroke="#7B2CFF" stroke-width="2"   opacity=".38"/>
      <line x1="360" y1="2" x2="360" y2="718" stroke="#7B2CFF" stroke-width="1.6" opacity=".30"/>
      <line x1="2" y1="360" x2="718" y2="360" stroke="#7B2CFF" stroke-width="1.6" opacity=".30"/>
      <circle cx="360" cy="360" r="7" fill="#7B2CFF"/>
    </svg>
  </div>
</div>
<script>
  if (location.search.indexOf("radar") >= 0) document.body.classList.add("con-radar");
</script>
</body>
</html>
