<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Concurso Soulfía · Blink · sin ficha</title>
<style>
  :root{
    --negro:  #0A0A0A;
    --morado: #7B2CFF;
    --blanco: #FFFFFF;
    /* El lima lo saqué del logo de @soulfiafp: rgb(184,248,112). */
    --lima:   #B8F870;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--negro); }

  .lamina{
    position:relative;
    width:1080px; height:1350px;
    background:var(--negro);
    overflow:hidden;
    font-family:"Montserrat", sans-serif;
  }

  /* ---------------------------------------------------------- la foto */
  .foto{ position:absolute; inset:0; }
  .foto img{
    width:1080px; height:1350px; object-fit:cover;
    object-position:50% 16%;
    filter:brightness(.92) contrast(1.04);
  }
  .velo{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg,
        rgba(10,10,10,.86) 0%,
        rgba(10,10,10,.30) 12%,
        rgba(10,10,10,0)   24%,
        rgba(10,10,10,.18) 38%,
        rgba(10,10,10,.66) 54%,
        rgba(10,10,10,.90) 68%,
        var(--negro)       80%);
  }

  /* ---------------------------------------- ZONA 1 · arriba, los logos */
  .collab{
    position:absolute; z-index:3; top:68px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:26px;
  }
  /* Las letras de BLINK ocupan el 54,3% de abajo de su PNG —medido—, porque
     el destello va encima. Sin corregir eso, al centrar las dos imágenes la
     palabra BLINK queda más abajo que FPSOULFIA. El desplazamiento las deja
     con la misma línea de letra, que es lo que se ve. */
  .collab img{ display:block; }
  .collab .blink{ width:96px; transform:translateY(-15px); }
  .collab .fp{ width:245px; }
  .collab .equis{
    font-weight:700; font-size:28px; color:var(--lima); line-height:1;
  }

  /* ------------------------------------ ZONA 2 · al medio, el titular */
  .titulo{
    position:absolute; z-index:3; left:72px; right:72px; bottom:276px;
    text-align:center;
  }
  .titular{
    font-family:"Anton", sans-serif;
    font-size:136px; line-height:.95; letter-spacing:1px;
    color:var(--blanco); text-transform:uppercase;
  }
  .titular span{ display:block; }
  .quien{
    margin-top:26px;
    font-weight:800; font-size:30px; letter-spacing:4.5px;
    color:var(--lima); text-transform:uppercase;
  }


  /* ------------------------------------------- ZONA 3 · el pie de todo */
  .pie{
    position:absolute; z-index:3; left:72px; right:72px; bottom:70px;
    padding-top:72px; border-top:1.5px solid rgba(255,255,255,.20);
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .pie span{
    font-weight:800; font-size:23px; letter-spacing:3.4px;
    color:var(--lima); text-transform:uppercase;
  }
  .pie svg{ width:23px; height:23px; flex:none; }
</style>
</head>
<body>
<div class="lamina" id="lamina">

  <div class="foto">
    <img src="soulfia-caballo.jpg" alt="">
    <div class="velo"></div>
  </div>

  <div class="collab">
    <img class="blink" src="logo-blink.png" alt="Blink">
    <div class="equis">×</div>
    <img class="fp" src="logo-soulfiafp.png" alt="SOULFIAFP">
  </div>

  <div class="titulo">
    <div class="titular"><span>Gana una</span><span>entrada doble</span></div>
    <div class="quien">Soulfía · Yegua en vivo</div>
  </div>

  <div class="pie">
    <span>Lee la descripción para participar</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="#B8F870" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 V19 M5 12 L12 19 L19 12"/>
    </svg>
  </div>

</div>

<script>
(async function(){
  await document.fonts.load("136px Anton");
  await document.fonts.load("800 30px Montserrat");
  await document.fonts.ready;

  // Las dos líneas del titular comparten cuerpo: se busca el mayor tamaño
  // con el que quepan las dos. Ajustándolas por separado, la corta quedaba
  // grande y la larga achicada, y se notaba el escalón.
  const lineas = [...document.querySelectorAll(".titular span")];
  let t = 136;
  while (t > 90 && lineas.some(l => l.scrollWidth > 936)){
    t -= 2;
    lineas.forEach(l => { l.style.fontSize = t + "px"; });
  }

  document.title = "listo";
})();
</script>
</body>
</html>
