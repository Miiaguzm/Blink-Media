<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Concurso Soulfía · Blink · lámina 2, las canciones</title>
<style>
  :root{
    --negro:  #0A0A0A;
    --morado: #7B2CFF;
    --blanco: #FFFFFF;
    /* El lima lo saqué del logo de @soulfiafp: rgb(184,248,112). Es el mismo
       verde con el que ella escribió los títulos sobre la espalda, así que la
       lámina y la gráfica del disco hablan el mismo idioma sin forzarlo. */
    --lima:   #B8F870;
    --linea:  rgba(255,255,255,.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--negro); }

  .lamina{
    position:relative;
    width:1080px; height:1350px;
    background:var(--negro);
    overflow:hidden;
    font-family:"Montserrat", sans-serif;
  }

  /* ---------------------------------------- ZONA 1 · arriba, los logos */
  /* Mismo bloque que la lámina del concurso, sin tocar nada: es lo que hace
     que las dos se lean como una sola publicación. */
  .collab{
    position:absolute; z-index:3; top:68px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:26px;
  }
  .collab img{ display:block; }
  .collab .blink{ width:96px; transform:translateY(-15px); }
  .collab .fp{ width:245px; }
  .collab .equis{
    font-weight:700; font-size:28px; color:var(--lima); line-height:1;
  }

  /* ---------------------------------------------- ZONA 2 · el titular */
  .titulo{
    position:absolute; z-index:3; left:72px; right:72px; top:260px;
    text-align:center;
    font-family:"Anton", sans-serif;
    font-size:80px; line-height:.95; letter-spacing:1px;
    color:var(--blanco); text-transform:uppercase;
  }
  .titulo span{ display:block; }

  /* --------------------------------------- ZONA 3 · su gráfica, enmarcada */
  /* La imagen que ella publicó es horizontal (1570x1182) y además es una
     captura de Instagram: trae la flecha de la izquierda y los dos puntitos
     del carrusel abajo al centro. Primero la probé de fondo a sangre y no
     sirve: los títulos en lima que ella escribió sobre la espalda se
     transparentan detrás del texto mío y se lee todo duplicado. Enmarcada
     funciona, porque pasa a ser lo que es: la gráfica del disco. El recorte
     empieza en x=75 y termina en y=1125 para que la flecha y los puntitos
     queden fuera. */
  .panel{
    position:absolute; z-index:3; left:72px; top:472px;
    width:936px; height:704px;
    overflow:hidden;
    border:1.5px solid var(--linea);
  }
  .panel img{ position:absolute; top:0; left:-47px; width:983px; }

  /* ------------------------------------------------- ZONA 4 · la fecha */
  .fecha{
    position:absolute; z-index:3; left:72px; right:72px; top:1242px;
    text-align:center;
    font-weight:800; font-size:23px; letter-spacing:3.6px;
    color:var(--lima); text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="lamina" id="lamina">

  <div class="collab">
    <img class="blink" src="logo-blink.png" alt="Blink">
    <div class="equis">×</div>
    <img class="fp" src="logo-soulfiafp.png" alt="SOULFIAFP">
  </div>

  <div class="titulo"><span>¡Conoce las canciones</span><span>antes del show!</span></div>

  <div class="panel">
    <img src="soulfia-tracklist.jpg" alt="">
  </div>

  <div class="fecha">Disponible desde el 5 de noviembre</div>

</div>

<script>
(async function(){
  await document.fonts.load("80px Anton");
  await document.fonts.load("800 23px Montserrat");
  await document.fonts.ready;

  // Las dos líneas del titular comparten cuerpo, igual que en la lámina del
  // concurso: ajustándolas por separado se nota el escalón.
  const lineas = [...document.querySelectorAll(".titulo span")];
  let t = 80;
  while (t > 56 && lineas.some(l => l.scrollWidth > 936)){
    t -= 2;
    lineas.forEach(l => { l.style.fontSize = t + "px"; });
  }

  document.title = "listo";
})();
</script>
</body>
</html>
