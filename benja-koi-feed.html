<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>KOI · Benja Valencia · Blink</title>
<style>
  :root{ --negro:#0A0A0A; --morado:#7B2CFF; --blanco:#FFFFFF; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--negro); }

  .lamina{
    position:relative; width:1080px; height:1350px;
    background:var(--negro); overflow:hidden;
    font-family:"Montserrat", sans-serif;
  }

  /* La foto manda: ocupa todo el ancho y dos tercios del alto. El texto vive
     abajo, en su propia zona, y no le pisa nada. Arriba queda una banda para
     el encabezado, porque el fondo de la foto es gris claro y el logo blanco
     ahí no se leería. */
  .fondo{ position:absolute; inset:0; overflow:hidden; }
  .fondo img{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1.4);
    width:1080px; height:1350px; object-fit:cover;
    filter:blur(30px) brightness(.26) saturate(1.2);
  }

  .retrato{ position:absolute; z-index:2; left:0; right:0; top:150px; height:830px;
            overflow:hidden; }
  /* El encuadre no va a ojo: la foto mide 1170x1163 y a ancho completo escala
     0,923, así que la cabeza queda entre y=78 y y=729 y entra entera con aire. */
  .retrato img{ width:1080px; height:1073px; object-fit:cover; object-position:50% 0%;
                display:block; }
  .retrato .base{
    position:absolute; left:0; right:0; bottom:0; height:300px;
    background:linear-gradient(180deg, rgba(10,10,10,0) 0%, rgba(10,10,10,.30) 42%,
      rgba(10,10,10,.82) 78%, var(--negro) 100%);
  }
  .retrato .tope{
    position:absolute; left:0; right:0; top:0; height:90px;
    background:linear-gradient(180deg, rgba(10,10,10,.42) 0%, rgba(10,10,10,0) 100%);
  }

  /* ------------------------------------------------------- encabezado */
  .piso{ position:absolute; z-index:3; left:0; right:0; top:960px; bottom:0;
         background:var(--negro); }

  .cabecera{ position:absolute; z-index:4; top:48px; left:72px; right:72px;
             display:flex; align-items:center; justify-content:space-between; }
  .categoria{ display:flex; align-items:center; gap:11px;
              font-weight:800; font-size:24px; letter-spacing:3.6px;
              color:var(--morado); text-transform:uppercase; }
  .fecha{ margin-top:9px; font-weight:600; font-size:22px; letter-spacing:2.4px;
          color:rgba(255,255,255,.70); }
  .cabecera img{ width:124px; display:block; }

  /* ---------------------------------------------------------- bloque */
  .bloque{ position:absolute; z-index:4; left:72px; right:72px; bottom:74px; }
  .pildora{
    display:inline-block; background:var(--morado); border-radius:999px;
    padding:13px 28px 11px;
    font-weight:800; font-size:23px; letter-spacing:3.4px;
    color:var(--blanco); text-transform:uppercase;
  }
  .titular{
    margin-top:22px;
    font-family:"Anton", sans-serif; font-size:88px; line-height:.96;
    letter-spacing:1px; color:var(--blanco); text-transform:uppercase;
  }
  .titular span{ display:block; }
  .titular .morado{ color:var(--morado); }
  .dato{
    margin-top:20px; font-weight:700; font-size:27px; letter-spacing:1.2px;
    color:rgba(255,255,255,.88);
  }
</style>
</head>
<body>
<div class="lamina">

  <div class="fondo"><img src="benja-koi-portada.jpg" alt=""></div>

  <div class="piso"></div>

  <div class="retrato">
    <img src="benja-koi-portada.jpg" alt="">
    <div class="tope"></div>
    <div class="base"></div>
  </div>

  <div class="cabecera">
    <div>
      <div class="categoria">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#7B2CFF">
          <path d="M12 0 L13.8 10.2 L24 12 L13.8 13.8 L12 24 L10.2 13.8 L0 12 L10.2 10.2 Z"/>
        </svg>
        Lanzamiento
      </div>
      <div class="fecha">18.NOV.2026</div>
    </div>
    <img src="logo-blink.png" alt="Blink">
  </div>

  <div class="bloque">
    <div class="pildora">Ya tiene fecha</div>
    <div class="titular"><span>KOI, el tercer disco</span><span class="morado">de Benja Valencia</span></div>
    <div class="dato">Jueves 26 de noviembre · 21:00</div>
  </div>

</div>

<script>
(async function(){
  await document.fonts.load("88px Anton");
  await document.fonts.load("800 23px Montserrat");
  await document.fonts.load("700 27px Montserrat");
  await document.fonts.ready;

  // Las dos líneas del titular comparten cuerpo: ajustadas por separado, la
  // corta queda grande y la larga achicada, y se nota el escalón.
  const lineas = [...document.querySelectorAll(".titular span")];
  let t = 88;
  while (t > 62 && lineas.some(l => l.scrollWidth > 936)){
    t -= 2;
    lineas.forEach(l => { l.style.fontSize = t + "px"; });
  }

  // document.fonts.check() miente: se comprueba midiendo, porque Anton es
  // condensada y tiene que medir bastante menos que Montserrat al mismo cuerpo.
  const m = document.createElement("canvas").getContext("2d");
  m.font = "100px Anton";       const a = m.measureText("HAMBURGUESA ABCDEFG").width;
  m.font = "100px Montserrat";  const b = m.measureText("HAMBURGUESA ABCDEFG").width;
  document.title = a < b * 0.85 ? "listo" : "FALTAN LAS FUENTES";
})();
</script>
</body>
</html>
